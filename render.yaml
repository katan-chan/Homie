services:
  - type: web
    name: vuon-cua-chung-minh-api
    runtime: node
    plan: free
    buildCommand: node --check backend/server.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGINS
        sync: false
