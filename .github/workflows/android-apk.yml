name: Android APK

on:
  # The app loads the live Vercel site, so web changes reach phones without a new APK.
  # Only rebuild when the native shell changes; `npx cap sync` writes new plugins into android/.
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      # Phone notifications need the Firebase app config; without the secret the APK builds with push turned off.
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json; fi

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          cd android && ./gradlew assembleRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk homie.apk
          gh release create "apk-${{ github.run_number }}" homie.apk \
            --target "${{ github.sha }}" \
            --title "Homie APK #${{ github.run_number }}" \
            --notes "Build từ commit ${{ github.sha }}. Tải homie.apk để cài lên Android."
